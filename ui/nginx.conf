# Serves the Angular single-page app. Unknown paths (e.g. /admin/usage after a reload) fall back
# to index.html so the Angular router can handle them.
# Runs as a non-root user (nginx-unprivileged image), so it listens on 8080 instead of 80.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;  # don't advertise the nginx version in headers and error pages

  # Security headers (security plan B3). `always` = also on error responses. They are set only
  # here: nginx drops server-level add_header lines in any location that has its own add_header,
  # so the locations below use `expires` for caching instead.
  # - CSP: the browser may only load scripts/data from this site; styles + fonts also from
  #   Google Fonts (index.html); 'unsafe-inline' styles because Angular Material sets inline
  #   styles; no framing (clickjacking), no plugins, forms only to this site.
  # - Sign in with Google (plan B1): Google's script, its button frame/styles and its server
  #   (accounts.google.com/gsi/ only, as Google documents) and profile photos from
  #   *.googleusercontent.com.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;          # no MIME-type guessing
  add_header X-Frame-Options "DENY" always;                    # older browsers: no framing
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API, on the same address as the UI (http://localhost:8081/api/...): nginx forwards to the
  # api container. Same origin = no CORS, and a local `rag serve` on port 8000 can't interfere.
  location /api/ {
    proxy_pass http://api:8000/;              # trailing slash: /api/health -> /health
    proxy_set_header Host $host;
    # The browser's real IP (the API's guest rate limit counts per IP, not per proxy). nginx is
    # the edge, so it REPLACES any X-Forwarded-For the client sent (a client can't fake its IP).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;                 # document uploads (the API enforces its own limit)
    proxy_read_timeout 300s;                  # answers + scoring can take a while on the free tier
  }

  # Hashed build files never change: cache them for a long time. index.html is not cached,
  # so a new deployment is picked up immediately (expires -1 = Cache-Control: no-cache).
  location ~* \.(js|css|woff2?|ico|svg)$ {
    expires 30d;
  }
  location = /index.html {
    expires -1;
  }
}
