[project]
name = "rag-platform"
version = "0.1.0"
description = "Domain-independent Agentic RAG platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "google-auth>=2.61",
    "langchain-community<0.4",
    "langchain-google-genai>=2.0",
    "langchain-groq>=1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "numpy>=2.5.4",
    "pydantic-settings>=2.4",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag_platform.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "reportlab>=4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    "ui",    # Angular app: npm packages may contain .py files (e.g. node-gyp)
    "docs",  # knowledge-pack Markdown: code examples are formatted for reading, not run
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/rag_platform/cli.py" = ["B008"]  # typer idiom: Option()/Argument() in defaults
"src/rag_platform/api/*.py" = ["B008"]  # fastapi idiom: Depends()/File() in defaults
